name: Build & déploiement Infomaniak

on:
  # Contrôle automatique à chaque push : build + vérification des liens, sans
  # rien envoyer sur le serveur de production.
  push:
    paths:
      - 'poc/**'
      - 'deploy/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  # Déploiement uniquement sur déclenchement manuel (Actions > Run workflow),
  # pour qu'aucun commit ne parte tout seul en production.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation (aucune écriture sur le serveur)'
        type: boolean
        default: true

jobs:
  build:
    name: Build et contrôle des liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dist/
        run: node tools/build.mjs --strict

      - name: Archiver dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  preview:
    name: Préversion GitHub Pages
    needs: build
    # Uniquement depuis la branche par défaut : la préversion doit refléter
    # l'état de référence, pas une branche de travail en cours.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --preview pose un noindex sur chaque page et retire le sitemap : la
      # préversion ne doit jamais concurrencer le site public dans les
      # résultats de recherche.
      - name: Build dist/ en mode préversion
        run: node tools/build.mjs --preview --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    name: Envoi FTPS vers Infomaniak
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dist/
        run: node tools/build.mjs --strict

      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Envoyer dist/
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/sites/schumpf-avocat.com' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          chmod +x deploy/upload.sh
          ./deploy/upload.sh
