name: Déploiement Infomaniak

# Le SEUL workflow qui écrit sur le site public schumpf-avocat.com.
# Déclenchement manuel exclusivement : aucun push, aucune fusion ne le lance.
# Le voir apparaître dans la liste des Actions signifie donc toujours qu'un
# déploiement a réellement eu lieu.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation (aucune écriture sur le serveur)'
        type: boolean
        default: true

jobs:
  deploy:
    name: Envoi FTPS vers Infomaniak
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --strict fait échouer le job sur un lien interne cassé, avant tout
      # transfert : rien de cassé ne peut atteindre la production.
      - name: Build dist/
        run: node tools/build.mjs --strict

      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Envoyer dist/
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/sites/schumpf-avocat.com' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          chmod +x deploy/upload.sh
          ./deploy/upload.sh
