name: Build & préversion

# Tourne à chaque push. N'écrit JAMAIS sur le serveur de production : la mise
# en ligne du site public est un geste manuel, dans le workflow
# « Déploiement Infomaniak ».

on:
  push:
    paths:
      - 'poc/**'
      - 'deploy/**'
      - 'tools/**'
      - '.github/workflows/ci.yml'
  # Permet de publier la préversion depuis une branche de travail, pour faire
  # relire une modification AVANT de la fusionner. Le site Pages étant unique,
  # une préversion de branche remplace celle en place jusqu'au prochain push
  # sur la branche par défaut.
  workflow_dispatch:

jobs:
  build:
    name: Build et contrôle des liens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dist/
        run: node tools/build.mjs --strict

      - name: Archiver dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  preview:
    name: Préversion GitHub Pages
    needs: build
    # Sur push : uniquement depuis la branche par défaut, pour qu'une branche
    # de travail ne remplace pas la préversion de référence à chaque commit.
    # Sur déclenchement manuel : depuis n'importe quelle branche, choisie
    # explicitement — c'est ce qui permet de faire valider avant de fusionner.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --preview pose un noindex sur chaque page et retire le sitemap : la
      # préversion ne doit jamais concurrencer le site public dans les
      # résultats de recherche.
      - name: Build dist/ en mode préversion
        run: node tools/build.mjs --preview --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - id: deployment
        uses: actions/deploy-pages@v4
